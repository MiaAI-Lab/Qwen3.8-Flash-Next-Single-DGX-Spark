# Kernel VM tunables for a DGX Spark (GB10) serving this checkpoint.
# Apply (resets on reboot):   sudo sysctl -p files/sysctl-spark3.conf
# Persist:                    sudo cp files/sysctl-spark3.conf /etc/sysctl.d/90-spark3-vllm.conf
#
# Why: the stock values are vm.min_free_kbytes=45155 (a 44 MB free-page floor
# on a 121 GiB box) and vm.watermark_scale_factor=10 (kswapd starts reclaiming
# at 0.1 % free). Against a GPU driver that allocates from the same pool in
# GiB/s bursts that is no floor and no early warning: on 2026-09-04 the NVIDIA
# driver logged NV_ERR_NO_MEMORY with MemFree around 3 GiB and the server died
# (docs/memory-incident-2026-09-04.md, section 7.2). spark1 measured six
# consecutive crash-free bring-up runs with exactly these three values, after
# three hard hangs without them (docs/HANDOFF-single-spark.md, section 6).
# They have not been measured on spark3 yet.
#
# What they cost. The reserve is CUDA-visible memory that vLLM can no longer
# take, and start.sh's HOST_RESERVE_GIB already leaves room for it. But note
# the accounting shift, computed from the kernel's watermark formula (not yet
# measured here): with min_free_kbytes=4 GiB and watermark_scale_factor=300
# the per-zone low watermark becomes ~7.7 GiB and the high watermark ~11.3 GiB
# (min + 3 % of RAM, and min + 6 %). MemAvailable is "free above the high
# watermark plus reclaimable cache above the low one", so the same physical
# state reads roughly 11 GiB lower in MemAvailable (up to ~15 GiB lower once
# page cache exceeds 2x the low watermark) than it does today, and kswapd will
# evict PLE page cache to keep MemFree above ~7.7 GiB. The watchdog's 6 GiB
# MemAvailable floor was set against today's accounting; re-derive it from a
# measured idle run before relying on both together.
#
# vm.min_free_kbytes: pages the kernel keeps free for itself and for callers
#   that cannot wait (the GPU driver among them). 4 GiB is what spark1 needed.
vm.min_free_kbytes = 4194304
# vm.watermark_scale_factor: how far above min_free kswapd starts (low) and
#   stops (high) reclaiming, in 1/10000 of RAM. 300 = 3 %: reclaim starts
#   early enough to stay ahead of a GiB/s allocator instead of at the cliff.
vm.watermark_scale_factor = 300
# vm.swappiness: the box ships with swap effectively unused; 30 lets the
#   16 GiB swap absorb anon overshoot instead of the pool exhausting.
vm.swappiness = 30
